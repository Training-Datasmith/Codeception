paths:
    tests: tests
    output: tests/log
    data: tests/data
    support: tests/support
    envs: tests/envs
settings:
    shuffle: true
    suite_class: \PHPUnit_Framework_TestSuite
    colors: true
    memory_limit: 1024M
    log: true
    lint: false
    be_strict_about_changes_to_global_state: false
    report_useless_tests: true

extensions:
    enabled: [Codeception\Extension\Run_Failed]
    config:
        Codeception\Extension\Run_Failed:
            fail-group: failed

coverage:
    enabled: true
    include:
        - src/Codeception/Command/*
